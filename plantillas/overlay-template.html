<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Overlay</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
  @font-face {
    font-family: 'AntonLocal';
    src: url(data:font/truetype;charset=utf-8;base64,ANTON_B64) format('truetype');
  }
  .brand-bug { position:absolute; top:56px; left:48px; right:48px; display:flex; justify-content:space-between; align-items:flex-start; }
  .logo-oviedo-badge { background:#fff; border-radius:12px; padding:10px 16px; box-shadow:0 4px 14px rgba(0,0,0,0.45); }
  .logo-oviedo-badge img { height:56px; width:auto; display:block; }
  .logo-padel { width:110px; height:110px; border-radius:50%; object-fit:cover; box-shadow:0 4px 14px rgba(0,0,0,0.45), 0 0 0 4px #fff; }

  .caption-wrap { position:absolute; left:0; right:0; bottom:0; }
  .scrim { position:absolute; left:0; right:0; bottom:0; height:520px;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.82) 55%, rgba(0,0,0,0.9) 100%); }
  .caption {
    position:absolute; left:56px; right:56px; bottom:80px;
    font-family:'AntonLocal', sans-serif;
    color:#fff; font-size:CAPTION_SIZEpx; line-height:1.04;
    text-shadow: 0 4px 14px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>
  <div class="brand-bug">
    <div class="logo-oviedo-badge"><img src="OVIEDO_B64" alt="Oviedo"></div>
    <img class="logo-padel" src="PADEL_B64" alt="Padel Rocks">
  </div>
  CAPTION_BLOCK
</body>
</html>
