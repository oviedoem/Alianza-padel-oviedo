<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
  html,body{width:1080px;height:1080px;overflow:hidden;background:#000;}

  .canvas{
    position:relative;
    width:1080px;height:1080px;
  }
  .bg{
    position:absolute;inset:0;
    background:url('../assets/fotos-sucursal/2026-09/cartel-oviedo-ferreterias-mts-01-realzada.jpg') center 22%/cover no-repeat;
  }
  .gradient{
    position:absolute;inset:0;
    background:linear-gradient(to bottom, rgba(0,0,0,0.10) 0%, rgba(0,0,0,0.20) 38%, rgba(0,0,0,0.80) 66%, rgba(0,0,0,0.95) 100%);
  }

  .diag-stripe{
    position:absolute;top:0;left:0;right:0;height:210px;
    background:#E11515;
    clip-path:polygon(0 0, 100% 0, 100% 62%, 0 100%);
  }
  .diag-stripe-black{
    position:absolute;top:0;left:0;right:0;height:210px;
    background:#0c0c0c;
    clip-path:polygon(0 0, 100% 0, 100% 40%, 0 78%);
    opacity:0.9;
  }

  .badge{
    position:absolute;top:44px;
    width:132px;height:132px;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,0.45);
    border:3px solid #fff;
    background:#fff;
  }
  .badge img{width:100%;height:100%;object-fit:cover;display:block;}
  .badge-padel{left:44px;}
  .badge-oviedo{right:44px;}

  .content{
    position:absolute;left:0;right:0;bottom:36px;
    padding:0 56px 0 56px;
  }

  .headline{
    color:#fff;
    font-size:42px;
    font-weight:800;
    line-height:1.18;
    margin-bottom:16px;
    text-shadow:0 2px 10px rgba(0,0,0,0.5);
  }
  .headline .accent{color:#E11515;}

  .subtext{
    color:#f2f2f2;
    font-size:24px;
    font-weight:600;
    line-height:1.3;
    margin-bottom:22px;
    max-width:960px;
  }

  .contactbar{
    background:#0c0c0c;
    border-top:3px solid #E11515;
    margin:0 -56px;
    padding:16px 56px 20px 56px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .contact-row{
    color:#fff;
    font-size:22px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .icon{width:22px;height:22px;flex-shrink:0;}
  .handles{
    color:#c9c9c9;
    font-size:19px;
    font-weight:600;
    margin-top:4px;
  }
  .handles b{color:#fff;}
</style>
</head>
<body>
  <div class="canvas">
    <div class="bg"></div>
    <div class="gradient"></div>
    <div class="diag-stripe-black"></div>
    <div class="diag-stripe"></div>

    <div class="badge badge-padel">
      <img src="../assets/logos/padel-rocks-rapel-logo.jpg">
    </div>
    <div class="badge badge-oviedo">
      <img src="../assets/logos/oviedo-ferreterias-logo.png">
    </div>

    <div class="content">
      <div class="headline">¿Construyendo en Rapel? <span class="accent">Cotiza en la mañana</span> y retira tus materiales en el pádel desde las 15:30 hrs.</div>
      <div class="subtext">¡Aprovecha tu tarde jugando!</div>

      <div class="contactbar">
        <div class="contact-row">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#E11515" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          WhatsApp Ferretería +56 9 3862 3488
        </div>
        <div class="contact-row">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#E11515" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          Sector El Estero S/N, Las Cabras
        </div>
        <div class="handles"><b>@oviedo_elmanzano</b> &nbsp;·&nbsp; <b>@padel_rocks_rapel</b></div>
      </div>
    </div>
  </div>
</body>
</html>
