<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
  html,body{width:1080px;height:1080px;overflow:hidden;background:#000;}

  .canvas{
    position:relative;
    width:1080px;height:1080px;
  }
  .bg{
    position:absolute;inset:0;
    background:url('../assets/fotos-padel-rocks/2026-09/cancha-nocturna-esquina-vidrio-01-realzada.jpg') center 38%/cover no-repeat;
  }
  .gradient{
    position:absolute;inset:0;
    background:linear-gradient(to bottom, rgba(0,0,0,0.10) 0%, rgba(0,0,0,0.18) 36%, rgba(0,0,0,0.80) 64%, rgba(0,0,0,0.95) 100%);
  }

  .badge{
    position:absolute;top:44px;
    width:132px;height:132px;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,0.45);
    border:3px solid #fff;
    background:#fff;
  }
  .badge img{width:100%;height:100%;object-fit:cover;display:block;}
  .badge-padel{left:44px;}
  .badge-oviedo{right:44px;}

  .content{
    position:absolute;left:0;right:0;bottom:36px;
    padding:0 56px 0 56px;
  }

  .headline{
    color:#fff;
    font-size:40px;
    font-weight:800;
    line-height:1.18;
    margin-bottom:20px;
    text-shadow:0 2px 10px rgba(0,0,0,0.5);
  }
  .headline .accent{color:#3FB84E;}

  .qr-row{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:22px;
  }
  .qr-box{
    width:112px;height:112px;
    background:#fff;
    border-radius:12px;
    padding:8px;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
    flex-shrink:0;
  }
  .qr-box img{width:100%;height:100%;display:block;}
  .qr-text{
    color:#f2f2f2;
    font-size:20px;
    font-weight:600;
    line-height:1.35;
    max-width:820px;
  }
  .qr-text b{color:#3FB84E;}

  .contactbar{
    background:#0c0c0c;
    border-top:3px solid #3FB84E;
    margin:0 -56px;
    padding:16px 56px 20px 56px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .contact-row{
    color:#fff;
    font-size:22px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .contact-row .dot{color:#3FB84E;font-weight:900;}
  .handles{
    color:#c9c9c9;
    font-size:19px;
    font-weight:600;
    margin-top:4px;
  }
  .handles b{color:#fff;}
</style>
</head>
<body>
  <div class="canvas">
    <div class="bg"></div>
    <div class="gradient"></div>

    <div class="badge badge-padel">
      <img src="../assets/logos/padel-rocks-rapel-logo.jpg">
    </div>
    <div class="badge badge-oviedo">
      <img src="../assets/logos/oviedo-ferreterias-logo.png">
    </div>

    <div class="content">
      <div class="headline">No te quedes sin jugar. <span class="accent">¡Escanea el código QR</span> y asegura tu horario ahora mismo!</div>

      <div class="qr-row">
        <div class="qr-box"><img src="../assets/logos/qr-reservas-padel-rocks.png"></div>
        <div class="qr-text">Reserva tus 2 canchas disponibles vía <b>EasyCancha</b> — Club "Padel Rocks Rapel", disponibilidad en tiempo real.</div>
      </div>

      <div class="contactbar">
        <div class="contact-row"><span class="dot">●</span> Reservas Pádel +56 9 5923 7808</div>
        <div class="contact-row"><span class="dot">●</span> Sector El Estero S/N, Las Cabras</div>
        <div class="handles"><b>@padel_rocks_rapel</b> &nbsp;·&nbsp; <b>@oviedo_elmanzano</b></div>
      </div>
    </div>
  </div>
</body>
</html>
